# Render Blueprint: one web service (dashboard + API + worker) and one private PostgreSQL database.
# STAGING / PILOT SHAPE ONLY. See docs/ops/render.md for what must be decided and done before real users and real documents.
databases:
  - name: duale-db
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []            # private network only; nothing on the internet can connect

services:
  - type: web
    name: duale-buildlink
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: free                 # FREE: sleeps after ~15 min idle; files are lost on restart; free database expires after 30 days
    healthCheckPath: /health/ready
    autoDeploy: false
    envVars:
      - key: PORT
        value: "8080"
      - key: ConnectionStrings__Default
        fromDatabase: { name: duale-db, property: connectionString }
      - key: Jwt__Key
        generateValue: true
      - key: Mfa__Key            # Render generates base64 of 256 random bits, which is what Mfa__Key requires
        generateValue: true
      - key: Finance__CallbackSecret
        generateValue: true
      - key: Metrics__Token
        generateValue: true
      - key: Bootstrap__AdminEmail
        sync: false              # asked for on first deploy
      - key: Bootstrap__AdminPassword
        sync: false
      - key: Database__AutoMigrate
        value: "true"
      - key: Files__Root
        value: /data/files
      - key: Web__ServeSpa
        value: "true"
      - key: Bootstrap__SuperAdminEmail
        value: updallaahmett08@gmail.com
      - key: Security__TrustProxy
        value: "true"            # Render terminates TLS and forwards X-Forwarded-*
      - key: Scanner__AllowNoop
        value: "true"            # STAGING ONLY: no virus scanner. Do not accept real identity documents like this.
      - key: Worker__Enabled
        value: "true"
      - key: Finance__AllowedCurrencies
        value: USD,SOS
      - key: Finance__Methods
        value: cash,bank,mobile_money,other
      - key: Finance__SelfApprovalLimit
        value: "0"
      # Email over HTTPS (works on the free plan, which blocks SMTP ports). Set these in the Render dashboard.
      - key: Brevo__ApiKey
        sync: false
      - key: Brevo__From
        sync: false
      - key: Brevo__FromName
        value: Duale
      # Email over Gmail SMTP (needs a paid Render plan; ignored when Brevo__ApiKey is set). Values are asked for / set in the Render dashboard (never commit the app password).
      - key: Smtp__Host
        value: smtp.gmail.com
      - key: Smtp__Port
        value: "587"
      - key: Smtp__User
        sync: false
      - key: Smtp__Password
        sync: false
      - key: Smtp__From
        sync: false
      - key: Smtp__FromName
        value: Duale
