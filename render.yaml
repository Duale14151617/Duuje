# NOTE: the resource names `armyhq-demo` and `armyhq-demo-db` (and the database/user names below) are kept on purpose. Renaming them
# in a Blueprint makes Render create a NEW service and a NEW empty database, so the running deployment would lose its data.
services:
  - type: web
    name: armyhq-demo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/live/
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: TRUST_PROXY_HEADERS
        value: "1"
      - key: ARMYHQ_SAMPLE_MODE
        value: "1"
      - key: ARMYHQ_SAMPLE_PASSWORD
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "0"
      - key: POSTGRES_DB
        fromDatabase:
          name: armyhq-demo-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: armyhq-demo-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: armyhq-demo-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: armyhq-demo-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: armyhq-demo-db
          property: port
      - key: POSTGRES_SSLMODE
        value: require
      - key: SESSION_COOKIE_AGE
        value: "1800"
      - key: SESSION_ABSOLUTE_SECONDS
        value: "43200"
      # Separation-of-duties override (super admin only, written reason, always audited). Deliberately ON here: the owner is the
      # only super admin and the only person with repository and deployment access.
      - key: ARMYHQ_BREAK_GLASS
        value: "1"
      - key: PERSONNEL_EXPORT_ENABLED
        value: "0"
      - key: REPORT_EXPORT_ENABLED
        value: "0"
      - key: INTEGRATIONS_ENABLED
        value: "0"
      # Email recovery for a lost authenticator app. Off until outgoing email works: set the switch to "1" and fill in the mail settings.
      - key: MFA_EMAIL_RECOVERY_ENABLED
        value: "0"
      # Self-service email: confirm an address with a code (Account page), and "Forgot your password?" on the sign-in page. Both off until
      # outgoing email works. Forgot-password only emails accounts whose address is verified, so turn on verification first.
      - key: EMAIL_VERIFICATION_ENABLED
        value: "0"
      - key: PASSWORD_FORGOT_ENABLED
        value: "0"
      # Render's free web services block SMTP. Brevo sends over HTTPS instead: set BREVO_API_KEY and a DEFAULT_FROM_EMAIL verified in Brevo.
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # A temporary password (new account or administrator reset) stops working after this many days.
      - key: TEMP_PASSWORD_DAYS
        value: "7"
      - key: ENABLE_API_DOCS
        value: "0"
      # Sample people: owned by the Render dashboard (sync: false), left unset = off.
      - key: ARMYHQ_TEST_PERSONNEL
        sync: false
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: armyhq-demo-db
    databaseName: armyhq_demo
    user: armyhq_demo_user
    plan: free
    region: singapore
    postgresMajorVersion: "16"
