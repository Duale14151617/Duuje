name: Unzip upload

# Upload a .zip to the repo (for example from your phone on github.com), then run this workflow.
#
#   mode = merge    Copy the zip's files into the repo. Files in the zip overwrite the repo's copies; files that are NOT
#                   in the zip stay untouched. Use this for an UPDATE zip that holds only the changed files.
#   mode = replace  Delete everything in the repo (except .git, .github and any other .zip files at the top level), then
#                   put the zip's files in. Use this for a FULL project zip. Files missing from the zip are removed.
#
# Leave zip_path empty and it uses the BIGGEST .zip in the repo. The zip is deleted after a successful run.
# The .github folder is never touched by either mode, so a zip cannot change workflows. Render redeploys from the new commit.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "merge = add/overwrite only (update zip). replace = wipe, then use the zip (full project zip)"
        type: choice
        options: [merge, replace]
        default: merge
      zip_path:
        description: "Optional: path of a specific zip. Leave empty to use the biggest .zip in the repo"
        required: false
        default: ""
      strip_top_folder:
        description: "Remove the single top-level folder inside the zip (for example Duuje-main/)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find zip
        id: find
        env:
          ZIP_INPUT: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail
          if [ -n "$ZIP_INPUT" ]; then
            ZIP="$ZIP_INPUT"
            case "$ZIP" in *..*|/*) echo "Invalid path"; exit 1;; esac
          else
            ZIP=$(find . -type f -iname '*.zip' -not -path './.git/*' -not -path '*/node_modules/*' \
                  -printf '%s\t%p\n' | sort -rn | head -n1 | cut -f2-)
            ZIP="${ZIP#./}"
          fi
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "No zip file found in the repo. Upload one first."
            exit 1
          fi
          unzip -tq "$ZIP" > /dev/null || { echo "The zip is corrupt."; exit 1; }
          echo "Using zip: $ZIP ($(du -h "$ZIP" | cut -f1)), sha256 $(sha256sum "$ZIP" | cut -d' ' -f1)"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract zip
        env:
          ZIP: ${{ steps.find.outputs.zip }}
          MODE: ${{ inputs.mode }}
          STRIP: ${{ inputs.strip_top_folder }}
        run: |
          set -euo pipefail
          rm -rf /tmp/extract && mkdir /tmp/extract
          unzip -q "$ZIP" -d /tmp/extract
          rm -rf /tmp/extract/__MACOSX
          SRC=/tmp/extract
          if [ "$STRIP" = "true" ]; then
            COUNT=$(find /tmp/extract -mindepth 1 -maxdepth 1 | wc -l)
            if [ "$COUNT" -eq 1 ] && [ -d "$(find /tmp/extract -mindepth 1 -maxdepth 1)" ]; then
              SRC=$(find /tmp/extract -mindepth 1 -maxdepth 1)
            fi
          fi
          # Never let a zip change workflows or git internals.
          rm -rf "$SRC/.git" "$SRC/.github"
          FILES=$(find "$SRC" -type f | wc -l)
          [ "$FILES" -gt 0 ] || { echo "The zip holds no files."; exit 1; }
          echo "Mode: $MODE. The zip holds $FILES files."

          if [ "$MODE" = "replace" ]; then
            # Guard against wiping the repo with a partial zip: a replace zip must look like a whole project.
            if [ "$FILES" -lt 20 ]; then
              echo "Refusing to replace: only $FILES files in the zip. Use mode=merge for an update zip."
              exit 1
            fi
            # Keep .git, .github and any other top-level zips (so a second upload can still be merged afterwards).
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -iname '*.zip' -exec rm -rf {} +
          fi
          rsync -a "$SRC"/ ./
          rm -f "$ZIP"

      - name: Summarise changes
        env:
          MODE: ${{ inputs.mode }}
        run: |
          git add -A
          {
            echo "### Unzip ($MODE)"
            echo '```'
            git diff --cached --shortstat || true
            echo '```'
            echo "Added: $(git diff --cached --name-only --diff-filter=A | wc -l) · Changed: $(git diff --cached --name-only --diff-filter=M | wc -l) · Deleted: $(git diff --cached --name-only --diff-filter=D | wc -l)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        env:
          ZIP: ${{ steps.find.outputs.zip }}
          MODE: ${{ inputs.mode }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Unzip $ZIP ($MODE)"
            git push
          fi
