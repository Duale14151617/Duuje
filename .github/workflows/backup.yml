name: Nightly database backup and restore test

# Dumps the live Render database every night, PROVES the dump restores into a throwaway database, encrypts it to a PUBLIC key (this
# repository never holds the means to read it) and keeps it as a private workflow artifact for 30 days. A dump that cannot be restored
# fails the job (GitHub emails you) and the System health heartbeat is not sent. Optionally also restores it into a Neon database as a
# second, ready-to-use copy. Setup is in docs/BACKUP_AND_RECOVERY.md. The repository MUST be private.

on:
  schedule:
    - cron: "17 21 * * *"   # 21:17 UTC = 00:17 in Garowe
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}      # Render "External Database URL"
      AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}    # age PUBLIC key (starts with age1...)
      NEON_URL: ${{ secrets.BACKUP_NEON_URL }}              # optional: Neon connection string for a live second copy
      HEARTBEAT_URL: ${{ secrets.BACKUP_HEARTBEAT_URL }}    # optional: the site address, e.g. https://policehq.onrender.com
      HEARTBEAT_TOKEN: ${{ secrets.BACKUP_HEARTBEAT_TOKEN }} # optional: same value as BACKUP_HEARTBEAT_TOKEN on Render
      PG_VERSION: "16"                                      # match the Render database's PostgreSQL version
    steps:
      - name: Check settings
        run: |
          [ -n "$DATABASE_URL" ] || { echo "::error::Secret BACKUP_DATABASE_URL is not set"; exit 1; }
          case "$AGE_RECIPIENT" in age1*) ;; *) echo "::error::Secret BACKUP_AGE_RECIPIENT must be an age public key (age1...)"; exit 1;; esac

      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Dump and encrypt
        run: |
          set -euo pipefail
          umask 077
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir out
          docker run --rm -e DATABASE_URL postgres:${PG_VERSION} \
            sh -c 'pg_dump --format=custom --no-owner --no-privileges "$DATABASE_URL"' > out/dump.raw
          # a dump that is suspiciously small means the connection or credentials failed quietly
          [ "$(stat -c %s out/dump.raw)" -gt 20000 ] || { echo "::error::Dump is too small to be real"; exit 1; }
          age -r "$AGE_RECIPIENT" -o "out/policehq-${stamp}.dump.age" out/dump.raw
          (cd out && sha256sum "policehq-${stamp}.dump.age" > "policehq-${stamp}.dump.age.sha256")
          echo "DUMP_RAW=out/dump.raw" >> "$GITHUB_ENV"
          echo "Backup size: $(stat -c %s out/policehq-${stamp}.dump.age) bytes"

      - name: Prove the dump restores into a scratch database
        run: |
          set -euo pipefail
          # A throwaway server of the same PostgreSQL version; it disappears when the job ends. Nothing here touches the live database.
          docker run -d --name scratch -e POSTGRES_PASSWORD=scratch-only -e POSTGRES_DB=restore_test "postgres:${PG_VERSION}" > /dev/null
          # The image starts a temporary server (socket only) to create the database, then restarts. Checking over TCP (127.0.0.1)
          # only succeeds once the real server is up, so the restore never races the restart.
          for i in $(seq 1 40); do
            docker exec scratch pg_isready -h 127.0.0.1 -U postgres -d restore_test > /dev/null 2>&1 && break
            [ "$i" -lt 40 ] || { echo "::error::The scratch database did not start"; exit 1; }
            sleep 2
          done
          docker exec -i scratch pg_restore --no-owner --no-privileges --exit-on-error -U postgres -d restore_test < "$DUMP_RAW"
          q() { docker exec scratch psql -U postgres -d restore_test -At -c "$1"; }
          tables=$(q "select count(*) from information_schema.tables where table_schema='public'")
          migrations=$(q "select count(*) from django_migrations")
          users=$(q "select count(*) from users")
          audit=$(q "select count(*) from audit_events")
          echo "Restored into a scratch database: $tables tables, $migrations applied migrations, $users users, $audit audit events."
          { [ "$tables" -gt 20 ] && [ "$migrations" -gt 0 ] && [ "$users" -gt 0 ]; } || { echo "::error::Restore check failed: the dump restores but looks empty"; exit 1; }
          {
            echo "### Backup restore test passed"
            echo "$tables tables, $migrations migrations, $users users, $audit audit events restored into a scratch database."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the scratch database
        if: always()
        run: docker rm -f scratch > /dev/null 2>&1 || true

      - name: Refresh the Neon copy (optional)
        if: env.NEON_URL != ''
        run: |
          set -euo pipefail
          docker run --rm -e NEON_URL -v "$PWD/out:/in:ro" postgres:${PG_VERSION} \
            sh -c 'pg_restore --clean --if-exists --no-owner --no-privileges --dbname "$NEON_URL" /in/dump.raw'

      - name: Remove the unencrypted dump
        if: always()
        run: shred -u out/dump.raw 2>/dev/null || rm -f out/dump.raw

      - name: Keep the encrypted backup for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: policehq-backup-${{ github.run_id }}
          path: out/
          retention-days: 30
          if-no-files-found: error

      - name: Tell the app the backup worked (optional)
        if: success()
        run: |
          if [ -n "$HEARTBEAT_URL" ] && [ -n "$HEARTBEAT_TOKEN" ]; then
            curl -fsS --max-time 60 --retry 3 --retry-delay 20 -X POST -H "X-Cron-Token: $HEARTBEAT_TOKEN" "${HEARTBEAT_URL%/}/api/v1/system/heartbeat/backup/"
          else
            echo "No heartbeat secrets set: the System health page will not know the backup ran."
          fi
