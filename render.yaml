# Police HQ Render Blueprint (app and database on Render; Neon is used only as a backup copy).
# Secret values are NOT stored in this file: import them from render.env in the Render dashboard.
services:
  - type: web
    name: policehq
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/live/
    envVars:
      - key: POLICEHQ_PROFILE
        value: police
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: POLICEHQ_ADMIN_PASSWORD
        sync: false
      - key: POSTGRES_DB
        fromDatabase:
          name: policehq-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: policehq-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: policehq-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: policehq-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: policehq-db
          property: port
      - key: POSTGRES_SSLMODE
        value: require
      - key: POLICEHQ_SITE_URL
        value: https://policehq.onrender.com
      - key: DJANGO_ALLOWED_HOSTS
        value: policehq.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://policehq.onrender.com
      - key: TRUST_PROXY_HEADERS
        value: "1"
      - key: NUM_PROXIES
        value: "3"
      - key: SECURE_SSL_REDIRECT
        value: "0"
      - key: SESSION_IDLE_SECONDS
        value: "1800"
      - key: SESSION_ABSOLUTE_SECONDS
        value: "43200"
      - key: POLICEHQ_BREAK_GLASS
        value: "0"
      - key: PERSONNEL_EXPORT_ENABLED
        value: "0"
      - key: REPORT_EXPORT_ENABLED
        value: "0"
      - key: INTEGRATIONS_ENABLED
        value: "0"
      - key: ENABLE_API_DOCS
        value: "0"
      - key: LOG_LEVEL
        value: INFO
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: POLICEHQ_ALERT_EMAILS
        sync: false
      - key: EMAIL_VERIFICATION_ENABLED
        value: "0"
      - key: PASSWORD_FORGOT_ENABLED
        value: "0"

databases:
  - name: policehq-db
    databaseName: policehq
    user: policehq_user
    plan: free
    region: singapore
    postgresMajorVersion: "16"
