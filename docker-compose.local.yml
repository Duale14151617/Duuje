# Local-only complete stack for Windows 11 + Docker Desktop.
# Synthetic demo data only. Never use these credentials for a public deployment.
services:
  db:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U armyhq_owner -d armyhq"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "1"
      USE_SQLITE: "0"
      POSTGRES_DB: armyhq
      POSTGRES_USER: armyhq_owner
      POSTGRES_PASSWORD: dev-only-change-me
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      ARMYHQ_DEMO_MODE: "1"
      ARMYHQ_DEMO_PASSWORD: ${ARMYHQ_DEMO_PASSWORD:-Demo-Only-Change-123!}
      SECURE_SSL_REDIRECT: "0"
      TRUST_PROXY_HEADERS: "0"
    ports:
      - "127.0.0.1:8000:10000"
    restart: unless-stopped
volumes:
  armyhq_pg:
