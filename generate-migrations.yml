name: Generate migrations

# Run from the GitHub app/mobile site: Actions -> Generate migrations -> Run workflow.
# First run (no Migrations folder yet): creates the same Initial + PostgresConstraints migrations the Render build would.
# Later runs: type a name (e.g. AddJobNotes) to add a new migration after you change the model.
on:
  workflow_dispatch:
    inputs:
      name:
        description: "New migration name (leave empty on the first run)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dotnet-ef
        run: |
          dotnet tool install -g dotnet-ef --version 8.0.11
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: First-time migrations
        if: ${{ inputs.name == '' }}
        run: bash scripts/render-migrations.sh

      - name: Add a new migration
        if: ${{ inputs.name != '' }}
        working-directory: src/Duale.Api
        run: |
          test -d Migrations || { echo "Run once with an empty name first."; exit 1; }
          dotnet ef migrations add "${{ inputs.name }}" -o Migrations

      - name: Commit migrations
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add src/Duale.Api/Migrations
          git diff --cached --quiet && { echo "Nothing new to commit."; exit 0; }
          git commit -m "Add EF migrations"
          git push
